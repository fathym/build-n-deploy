# Reusable container build + Azure Web App deploy for every Fathym runtime.
#
# Twelve repos carried a byte-identical copy of this. The ENTIRE variation was:
#   AZURE_APP_NAME  = the repo name, in all 12
#   IMAGE_NAME      = <AZURE_APP_NAME>:latest, in all 12
#   `deno task test` step present in 5, absent in 7
#   azure/login @v1 in 10, @v2 in 2
# which is one required input plus one flag -- not twelve workflows.
#
# A composite action could not do this: `concurrency`, `runs-on` and
# `permissions` are workflow/job-level keys. `vars` inside a called workflow
# resolves to the CALLER's repository variables, so vars.CI_RUNNER_LABEL keeps
# reading each repo's own value.

name: Container Build and Deploy

on:
  workflow_call:
    inputs:
      app-name:
        description: 'Azure Web App name. Also the ACR image name. The only required input.'
        type: string
        required: true
      image-tag:
        description: 'ACR image tag.'
        type: string
        default: 'latest'
      test-task:
        description: "deno task to run before building. Empty string skips the step entirely."
        type: string
        default: ''
      deno-version:
        description: 'Deno version for denoland/setup-deno. Only used when test-task is set.'
        type: string
        default: 'v2.x.x'
      dockerfile:
        description: 'Path to the Dockerfile.'
        type: string
        default: 'DOCKERFILE'
      default-runner:
        description: 'Runner label when the caller has no CI_RUNNER_LABEL variable.'
        type: string
        default: 'ubuntu-latest'
      warm-only:
        description: >-
          Build the image but do NOT push or deploy. Used by the nightly
          schedule to keep the shared build cache warm -- shared, so one box
          warming at 4am warms every box, including boxes added later. A Deno
          release changes the :latest digest and busts every layer including
          RUN deno install
          (~87s per runtime, ~16 min fleet-wide); warming overnight means that
          cost is paid at 4am instead of by whoever deploys next. It also means
          a Deno release that breaks the build is found by CI rather than by a
          production deploy.
        type: boolean
        default: false
    # CALLERS MUST PASS THESE EXPLICITLY -- `secrets: inherit` DOES NOT WORK
    # HERE. inherit does not pass secrets to a reusable workflow in a
    # DIFFERENT organization, and every caller lives in fathym-deno or
    # o-industrial while this workflow lives in fathym. With inherit the
    # required check fails before the job starts: 1-second failure, no runner,
    # no steps, no log, no annotation. Confirmed by bisection on
    # open-industrial-web-runtime, 2026-08-24.
    secrets:
      ACR_REGISTRY:      { required: true }
      ACR_USERNAME:      { required: true }
      ACR_PASSWORD:      { required: true }
      AZURE_CREDENTIALS: { required: true }

jobs:
  build-and-push:
    # CI_RUNNER_LABEL_DEPLOY wins over CI_RUNNER_LABEL so a repo can send its
    # CI to one pool and its production deploys to another. Both resolve
    # against the CALLER's variables, which is why a repo that flips
    # CI_RUNNER_LABEL for its test lane silently moves its deploys too unless
    # it also sets CI_RUNNER_LABEL_DEPLOY. Unset, this changes nothing.
    runs-on: ${{ vars.CI_RUNNER_LABEL_DEPLOY || vars.CI_RUNNER_LABEL || inputs.default-runner }}

    # DELIBERATELY UNLIKE THE LIBRARY SURFACE: cancel-in-progress is false.
    # Cancelling a library build wastes a JSR version number, which is
    # harmless and proven. Cancelling mid-`webapps-deploy` can leave a Web App
    # pointing at a half-swapped image. Queue instead.
    concurrency:
      group: deploy-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Deno Setup
        if: inputs.test-task != ''
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ inputs.deno-version }}

      # Runs before the image build so a red guard blocks the deploy rather
      # than shipping a broken bundle (open-industrial-web-runtime#104).
      - name: Test
        if: inputs.test-task != ''
        run: deno task ${{ inputs.test-task }}

      # driver: docker-container, because the `docker` driver CANNOT export
      # cache at all ("Cache export is not supported for the docker driver"),
      # and a cache the other boxes can read is the whole point of the
      # cache-to/cache-from below. A second self-hosted box gets nothing from a
      # cache that lives only in the first box's daemon.
      #
      # The leak that put us on `driver: docker` was a v1 bug, not a property of
      # the container driver: setup-buildx-action@v1 left one BuildKit container
      # per run on the self-hosted box -- 11 found up 12-13 hours, holding
      # 6.8 GB of cache no later job could reach, and the weekly prune cannot
      # touch a running container. @v3 removes the builder at the end of every
      # job (`cleanup`, which defaults to true -- set explicitly here because
      # the whole no-leak argument rests on it). `keep-state` then preserves the
      # BuildKit state volume across jobs, which the action documents as "only
      # useful on persistent self-hosted runners": exactly this fleet. So the
      # box keeps its warm cache and the container still does not survive.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          cleanup: true
          keep-state: true

      - name: Login via Azure CLI
        if: ${{ !inputs.warm-only }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Unconditional, unlike the azure/login above: a warm-only run deploys
      # nothing, but it DOES write the shared build cache into the ACR, and that
      # write needs registry auth. Without this the nightly warm would succeed
      # locally and reach no other box, which is the failure it exists to avoid.
      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build the Docker image
        uses: docker/build-push-action@v6
        with:
          # warm-only builds the layers into the shared cache and stops there.
          push: ${{ !inputs.warm-only }}
          tags: ${{ secrets.ACR_REGISTRY }}/${{ inputs.app-name }}:${{ inputs.image-tag }}
          file: ${{ inputs.dockerfile }}
          context: .
          provenance: false   # skips the attestation-manifest export
          # One cache per app, on its own tag in the ACR every runner already
          # authenticates to. No new storage account, no new secret, and not the
          # experimental type=azblob exporter. Whichever box builds first warms
          # it for all of them, including boxes that do not exist yet.
          #
          # mode=max keeps the intermediate layers, which is the only way
          # `RUN deno install` (~87s per runtime) is ever reused; mode=min would
          # keep the final stage only and the expensive layer would rebuild every
          # time. ignore-error stops a cache-export failure -- a registry blip,
          # a quota -- from failing a production deploy that already built and
          # pushed a good image. On the very first run the cache tag does not
          # exist yet; buildx warns on the import and continues.
          cache-from: type=registry,ref=${{ secrets.ACR_REGISTRY }}/${{ inputs.app-name }}:buildcache
          cache-to: type=registry,ref=${{ secrets.ACR_REGISTRY }}/${{ inputs.app-name }}:buildcache,mode=max,ignore-error=true

      - name: Deploy to Web App for Containers
        if: ${{ !inputs.warm-only }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ inputs.app-name }}
          images: ${{ secrets.ACR_REGISTRY }}/${{ inputs.app-name }}:${{ inputs.image-tag }}
