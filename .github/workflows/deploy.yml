# Reusable container build + Azure Web App deploy for every Fathym runtime.
#
# Twelve repos carried a byte-identical copy of this. The ENTIRE variation was:
#   AZURE_APP_NAME  = the repo name, in all 12
#   IMAGE_NAME      = <AZURE_APP_NAME>:latest, in all 12
#   `deno task test` step present in 5, absent in 7
#   azure/login @v1 in 10, @v2 in 2
# which is one required input plus one flag -- not twelve workflows.
#
# A composite action could not do this: `concurrency`, `runs-on` and
# `permissions` are workflow/job-level keys. `vars` inside a called workflow
# resolves to the CALLER's repository variables, so vars.CI_RUNNER_LABEL keeps
# reading each repo's own value.

name: Container Build and Deploy

on:
  workflow_call:
    inputs:
      app-name:
        description: 'Azure Web App name. Also the ACR image name. The only required input.'
        type: string
        required: true
      image-tag:
        description: 'ACR image tag.'
        type: string
        default: 'latest'
      test-task:
        description: "deno task to run before building. Empty string skips the step entirely."
        type: string
        default: ''
      deno-version:
        description: 'Deno version for denoland/setup-deno. Only used when test-task is set.'
        type: string
        default: 'v2.x.x'
      dockerfile:
        description: 'Path to the Dockerfile.'
        type: string
        default: 'DOCKERFILE'
      default-runner:
        description: 'Runner label when the caller has no CI_RUNNER_LABEL variable.'
        type: string
        default: 'ubuntu-latest'
      warm-only:
        description: >-
          Build the image but do NOT push or deploy. Used by the nightly
          schedule to keep the shared build cache warm -- shared, so one box
          warming at 4am warms every box, including boxes added later. A Deno
          release changes the :latest digest and busts every layer including
          RUN deno install
          (~87s per runtime, ~16 min fleet-wide); warming overnight means that
          cost is paid at 4am instead of by whoever deploys next. It also means
          a Deno release that breaks the build is found by CI rather than by a
          production deploy.
        type: boolean
        default: false
      # THE EXTRA CHECKOUT. A caller cannot add files to the build context any
      # other way: a job-level `uses:` lets it run no steps inside this job,
      # and there is no build-arg, secret or context input. With
      # extra-repository empty (the default) none of the three steps below
      # runs and this workflow behaves exactly as before.
      extra-repository:
        description: >-
          A second repository (owner/name) to check out into the build context
          before the image build, for files the image needs that live outside
          the caller's repo. Empty skips the extra checkout entirely.
        type: string
        default: ''
      extra-ref:
        description: 'Branch, tag or sha of extra-repository. Required when extra-repository is set: an unpinned ref would let the image content move without a commit in the caller.'
        type: string
        default: ''
      extra-path:
        description: 'Folder, relative to the caller repo root, the extra repository is checked out into. Required when extra-repository is set, and it must stay inside the build context.'
        type: string
        default: ''
      extra-app-id:
        description: >-
          GitHub App id used to mint a read-only token for extra-repository.
          Needed when that repository is private or in another organization.
          Empty = the job's own GITHUB_TOKEN, which only reads the caller's
          repository and public ones. Pass it with the EXTRA_APP_PRIVATE_KEY
          secret.
        type: string
        default: ''
      # THE OAUTH SIGNING KEY (track-30 D30.17.42). Michael, 2026-10-14, picked
      # "Yes, make it automatically (Recommended)": each deploy checks the key
      # exists, creates it only if it is missing, and never shows or replaces it.
      # Off (the default), the step below does not run and nothing changes.
      ensure-oauth-signing-key:
        description: >-
          Before deploying, make sure the app's OAuth signing key exists in its
          Key Vault: the secret named by the app's OAUTH_SIGNING_KEY_REF
          ($secret:<name>) in the vault named by its OAUTH_SIGNING_KEY_VAULT
          setting. Present: nothing is written. Absent: a new RSA private JWK
          (with a kid) is generated and stored as that secret. The key is never
          printed and an existing secret is never replaced.
        type: boolean
        default: false
    # CALLERS MUST PASS THESE EXPLICITLY -- `secrets: inherit` DOES NOT WORK
    # HERE. inherit does not pass secrets to a reusable workflow in a
    # DIFFERENT organization, and every caller lives in fathym-deno or
    # o-industrial while this workflow lives in fathym. With inherit the
    # required check fails before the job starts: 1-second failure, no runner,
    # no steps, no log, no annotation. Confirmed by bisection on
    # open-industrial-web-runtime, 2026-08-24.
    secrets:
      ACR_REGISTRY:      { required: true }
      ACR_USERNAME:      { required: true }
      ACR_PASSWORD:      { required: true }
      AZURE_CREDENTIALS: { required: true }
      # Optional, and passed explicitly like the four above (inherit fails
      # across organizations). The private key of the App named by
      # extra-app-id. Never needed by a caller that sets no extra-repository.
      EXTRA_APP_PRIVATE_KEY: { required: false }

jobs:
  build-and-push:
    # CI_RUNNER_LABEL_DEPLOY wins over CI_RUNNER_LABEL so a repo can send its
    # CI to one pool and its production deploys to another. Both resolve
    # against the CALLER's variables, which is why a repo that flips
    # CI_RUNNER_LABEL for its test lane silently moves its deploys too unless
    # it also sets CI_RUNNER_LABEL_DEPLOY. Unset, this changes nothing.
    runs-on: ${{ vars.CI_RUNNER_LABEL_DEPLOY || vars.CI_RUNNER_LABEL || inputs.default-runner }}

    # DELIBERATELY UNLIKE THE LIBRARY SURFACE: cancel-in-progress is false.
    # Cancelling a library build wastes a JSR version number, which is
    # harmless and proven. Cancelling mid-`webapps-deploy` can leave a Web App
    # pointing at a half-swapped image. Queue instead.
    concurrency:
      group: deploy-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      # ── THE EXTRA CHECKOUT (all three steps skip when extra-repository is empty) ──
      # It runs AFTER the caller's checkout, which cleans the workspace, and
      # BEFORE the Test step and the image build, so both see the files.
      # A half-set request is refused by name rather than guessed at: a
      # missing ref would track a moving branch, and a path outside the
      # workspace would land outside the build context and ship nothing.
      - name: Check the extra checkout request
        id: extracheck
        if: inputs.extra-repository != ''
        env:
          EXTRA_REPOSITORY: ${{ inputs.extra-repository }}
          EXTRA_REF: ${{ inputs.extra-ref }}
          EXTRA_PATH: ${{ inputs.extra-path }}
        run: |
          fail() { echo "::error::extra checkout: $1"; exit 1; }
          [[ "$EXTRA_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || fail "extra-repository must be owner/name"
          [ -n "$EXTRA_REF" ] || fail "extra-ref is required when extra-repository is set"
          [ -n "$EXTRA_PATH" ] || fail "extra-path is required when extra-repository is set"
          case "$EXTRA_PATH" in
            /*|*..*) fail "extra-path must be a relative folder inside the repository, with no '..'" ;;
          esac
          echo "owner=${EXTRA_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${EXTRA_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"
          echo "extra checkout: $EXTRA_REPOSITORY at $EXTRA_REF into $EXTRA_PATH"

      # The App token is scoped to that one repository, contents read only.
      # `owner` and `repositories` are the two halves of extra-repository,
      # split by the check step above (expressions have no split), so the
      # token cannot read anything else the App is installed on.
      - name: Mint a read token for the extra repository
        id: extratoken
        if: inputs.extra-repository != '' && inputs.extra-app-id != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.extra-app-id }}
          private-key: ${{ secrets.EXTRA_APP_PRIVATE_KEY }}
          owner: ${{ steps.extracheck.outputs.owner }}
          repositories: ${{ steps.extracheck.outputs.name }}
          permission-contents: read

      - name: Checkout the extra repository
        if: inputs.extra-repository != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.extra-repository }}
          ref: ${{ inputs.extra-ref }}
          path: ${{ inputs.extra-path }}
          token: ${{ steps.extratoken.outputs.token || github.token }}
          persist-credentials: false
          fetch-depth: 1

      - name: Deno Setup
        if: inputs.test-task != '' || (inputs.ensure-oauth-signing-key && !inputs.warm-only)
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ inputs.deno-version }}

      # Runs before the image build so a red guard blocks the deploy rather
      # than shipping a broken bundle (open-industrial-web-runtime#104).
      - name: Test
        if: inputs.test-task != ''
        run: deno task ${{ inputs.test-task }}

      # driver: docker-container, because the `docker` driver CANNOT export
      # cache at all ("Cache export is not supported for the docker driver"),
      # and a cache the other boxes can read is the whole point of the
      # cache-to/cache-from below. A second self-hosted box gets nothing from a
      # cache that lives only in the first box's daemon.
      #
      # The leak that put us on `driver: docker` was a v1 bug, not a property of
      # the container driver: setup-buildx-action@v1 left one BuildKit container
      # per run on the self-hosted box -- 11 found up 12-13 hours, holding
      # 6.8 GB of cache no later job could reach, and the weekly prune cannot
      # touch a running container. @v3 removes the builder at the end of every
      # job (`cleanup`, which defaults to true -- set explicitly here because
      # the whole no-leak argument rests on it).
      #
      # keep-state: false. The first v2 set it true, reasoning that the box
      # would keep a warm local cache. It could not: the action names each
      # run's builder `builder-<uuid>`, so no later job ever asks for the kept
      # volume, and every build left one `buildx_buildkit_*_state` volume
      # behind (24 of them, 16.6 GB, found when ftm-ci-runner-01's disk filled
      # on 2026-10-01). A fixed builder name does not rescue it: one host runs
      # up to 16 runner processes at once, so a per-host name would share one
      # builder between concurrent jobs (and one job's cleanup would remove it
      # under another), and a per-runner name would keep ~31 local BuildKit
      # caches that nothing caps (buildcache-cap trims the default builder's
      # cache only). Dropping keep-state changes no build's speed: every v2
      # run already started locally cold and warmed from the ACR registry cache
      # below, which is the shared cache this file exists for.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          cleanup: true
          keep-state: false

      - name: Login via Azure CLI
        if: ${{ !inputs.warm-only }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── THE OAUTH SIGNING KEY (D30.17.42; skips unless ensure-oauth-signing-key) ──
      # The app's own settings name the vault and the secret, so there is one
      # source of truth: the same OAUTH_SIGNING_KEY_VAULT / OAUTH_SIGNING_KEY_REF
      # the runtime reads at boot. Every refusal is by name and prints no value
      # but the vault and secret NAMES. The key is generated into a 0600 temp
      # file, handed to `az keyvault secret set --file`, and deleted; it never
      # reaches the log. Only a SecretNotFound answer leads to a write, so a
      # present key is never replaced and a read we were refused never becomes
      # a guess. Runs before the deploy, so a refused write blocks it.
      - name: Ensure the OAuth signing key
        if: ${{ inputs.ensure-oauth-signing-key && !inputs.warm-only }}
        env:
          APP_NAME: ${{ inputs.app-name }}
        run: |
          set -euo pipefail
          fail() { echo "::error::ensure OAuth signing key: $1"; exit 1; }

          rg=$(az webapp list --query "[?name=='${APP_NAME}'].resourceGroup | [0]" -o tsv) \
            || fail "OAUTH_SIGNING_KEY_APP_UNREADABLE: the web app '${APP_NAME}' could not be listed."
          [ -n "$rg" ] || fail "OAUTH_SIGNING_KEY_APP_NOT_FOUND: no web app named '${APP_NAME}'."

          setting() {
            az webapp config appsettings list --name "$APP_NAME" --resource-group "$rg" \
              --query "[?name=='$1'].value | [0]" -o tsv
          }
          vault=$(setting OAUTH_SIGNING_KEY_VAULT) \
            || fail "OAUTH_SIGNING_KEY_SETTINGS_UNREADABLE: the app settings of '${APP_NAME}' could not be read."
          ref=$(setting OAUTH_SIGNING_KEY_REF) \
            || fail "OAUTH_SIGNING_KEY_SETTINGS_UNREADABLE: the app settings of '${APP_NAME}' could not be read."

          [ -n "$vault" ] || fail "OAUTH_SIGNING_KEY_VAULT_MISSING: '${APP_NAME}' has no OAUTH_SIGNING_KEY_VAULT setting."
          case "$ref" in
            '$secret:'?*) name="${ref#\$secret:}" ;;
            *) fail "OAUTH_SIGNING_KEY_REF_NOT_A_REFERENCE: '${APP_NAME}' OAUTH_SIGNING_KEY_REF must be a \$secret:<name> reference." ;;
          esac
          [[ "$name" =~ ^[A-Za-z0-9-]{1,127}$ ]] \
            || fail "OAUTH_SIGNING_KEY_REF_NAME_INVALID: the referenced secret name is not a Key Vault secret name."

          if out=$(az keyvault secret show --vault-name "$vault" --name "$name" --query id -o tsv 2>&1); then
            echo "OAuth signing key '${name}' is present in vault '${vault}'; nothing written."
            exit 0
          fi
          case "$out" in
            *SecretNotFound*) ;;
            *Forbidden*|*"does not have secrets get permission"*)
              fail "OAUTH_SIGNING_KEY_VAULT_FORBIDDEN: the deploy identity may not read secrets in vault '${vault}'. Grant it Key Vault Secrets Officer on that vault." ;;
            *) fail "OAUTH_SIGNING_KEY_VAULT_UNREADABLE: secret '${name}' in vault '${vault}' could not be read." ;;
          esac

          umask 077
          keyfile=$(mktemp)
          trap 'rm -f "$keyfile"' EXIT
          deno eval '
            const pair = await crypto.subtle.generateKey(
              { name: "RSASSA-PKCS1-v1_5", modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: "SHA-256" },
              true,
              ["sign", "verify"],
            );
            const jwk = await crypto.subtle.exportKey("jwk", pair.privateKey);
            const { kty, n, e, d, p, q, dp, dq, qi } = jwk;
            await Deno.stdout.write(new TextEncoder().encode(JSON.stringify({ kty, kid: crypto.randomUUID(), n, e, d, p, q, dp, dq, qi })));
          ' > "$keyfile"

          if ! err=$(az keyvault secret set --vault-name "$vault" --name "$name" --file "$keyfile" \
            --content-type application/jwk+json --query id -o tsv 2>&1 >/dev/null); then
            case "$err" in
              *Forbidden*|*"does not have secrets set permission"*)
                fail "OAUTH_SIGNING_KEY_VAULT_FORBIDDEN: the deploy identity may not set secrets in vault '${vault}'. Grant it Key Vault Secrets Officer on that vault." ;;
              *) fail "OAUTH_SIGNING_KEY_WRITE_FAILED: secret '${name}' could not be written to vault '${vault}'." ;;
            esac
          fi
          echo "OAuth signing key '${name}' was missing from vault '${vault}' and has been created."

      # Unconditional, unlike the azure/login above: a warm-only run deploys
      # nothing, but it DOES write the shared build cache into the ACR, and that
      # write needs registry auth. Without this the nightly warm would succeed
      # locally and reach no other box, which is the failure it exists to avoid.
      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build the Docker image
        uses: docker/build-push-action@v6
        with:
          # warm-only builds the layers into the shared cache and stops there.
          push: ${{ !inputs.warm-only }}
          tags: ${{ secrets.ACR_REGISTRY }}/${{ inputs.app-name }}:${{ inputs.image-tag }}
          file: ${{ inputs.dockerfile }}
          context: .
          provenance: false   # skips the attestation-manifest export
          # One cache per app, on its own tag in the ACR every runner already
          # authenticates to. No new storage account, no new secret, and not the
          # experimental type=azblob exporter. Whichever box builds first warms
          # it for all of them, including boxes that do not exist yet.
          #
          # mode=max keeps the intermediate layers, which is the only way
          # `RUN deno install` (~87s per runtime) is ever reused; mode=min would
          # keep the final stage only and the expensive layer would rebuild every
          # time. ignore-error stops a cache-export failure -- a registry blip,
          # a quota -- from failing a production deploy that already built and
          # pushed a good image. On the very first run the cache tag does not
          # exist yet; buildx warns on the import and continues.
          cache-from: type=registry,ref=${{ secrets.ACR_REGISTRY }}/${{ inputs.app-name }}:buildcache
          cache-to: type=registry,ref=${{ secrets.ACR_REGISTRY }}/${{ inputs.app-name }}:buildcache,mode=max,ignore-error=true

      - name: Deploy to Web App for Containers
        if: ${{ !inputs.warm-only }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ inputs.app-name }}
          images: ${{ secrets.ACR_REGISTRY }}/${{ inputs.app-name }}:${{ inputs.image-tag }}
